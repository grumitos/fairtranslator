<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>FairTranslator</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0e0e10;
      }
      #ft-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0e0e10;
        transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #ft-splash[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }
      #ft-splash .dots {
        display: flex;
        gap: 8px;
      }
      #ft-splash .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ededef;
        opacity: 0.25;
        animation: ft-dot 1.2s ease-in-out infinite;
      }
      #ft-splash .dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      #ft-splash .dot:nth-child(3) {
        animation-delay: 0.32s;
      }
      @keyframes ft-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #ft-splash .dot {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="ft-splash" role="status" aria-label="Cargando" data-tauri-drag-region>
      <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
        <defs>
          <mask id="ft-splash-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
            <rect width="24" height="24" fill="#fff" />
            <path d="M10.2 10.8H19.4L22 13.4V19.4L19.4 22H10.2L7.6 19.4V13.4Z" fill="#000" stroke="#000" stroke-width="2.6" />
          </mask>
        </defs>
        <path fill="#ededef" fill-rule="evenodd" mask="url(#ft-splash-cut)" d="M4.6 2H13.8L16.4 4.6V10.6L13.8 13.2H4.6L2 10.6V4.6Z M5.68 4.6L4.6 5.68V9.52L5.68 10.6H12.72L13.8 9.52V5.68L12.72 4.6Z" />
        <path fill="#ededef" fill-rule="evenodd" d="M10.2 10.8H19.4L22 13.4V19.4L19.4 22H10.2L7.6 19.4V13.4Z M12.2 14.8H17.4L14.8 18Z" />
      </svg>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
