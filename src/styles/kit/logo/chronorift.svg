<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <title>ChronoRift: mark and app tile</title>
  <desc>Reference example of the kit's logo rules. Left: the app tile, the source of tauri icon
(src-tauri/icons/icon.svg in ChronoRift). Right: the mark in ink on dark and in #0E0E10 on light,
at 96 px and at the mandatory check sizes 32, 24, 20 and 16 px; view this file at 100 %.</desc>
  <style>text { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; }</style>
  <rect width="720" height="180" fill="#0E0E10"/>
  <rect y="180" width="360" height="180" fill="#0E0E10"/>
  <rect x="360" y="180" width="360" height="180" fill="#FFFFFF"/>

  <!-- App tile on a 1024 canvas: tile 944 inset 40, chamfer 170 (18 %), #1E1E22 (the bg-3 token).
       The mark's 24-grid box is 640 wide at 192 (26 2/3 px per unit), so the visible mark
       (20 units, 533 1/3 px) sits 205 1/3 px (21.75 %) inside the tile edge. -->
  <svg x="52" y="52" width="256" height="256" viewBox="0 0 1024 1024">
    <path d="M210 40H814L984 210V814L814 984H210L40 814V210Z" fill="#1E1E22"/>
    <svg x="192" y="192" width="640" height="640" viewBox="0 0 24 24" fill="#EDEDEF">
      <path d="M2 5.6L5.6 2H20.16L17.56 4.6H6.68L4.6 6.68V17.56L2 20.16Z"/>
      <path d="M22 18.4L18.4 22H3.84L6.44 19.4H17.32L19.4 17.32V6.44L22 3.84Z"/>
      <path d="M11.35 7.9V16.1L6.35 12Z"/>
      <path d="M17.65 7.9V16.1L12.65 12Z"/>
    </svg>
  </svg>

