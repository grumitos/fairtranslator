<svg xmlns="http://www.w3.org/2000/svg" width="720" height="744" viewBox="-3 -3 30 31">
  <title>Logo construction template: 24 grid, margin 2</title>
  <desc>Draw the mark in the "artwork" group on top: filled paths only, no strokes, one color.
Hide or lock the other groups. Numbers are grid units; see construction.md.</desc>
  <style>
    .grid-minor { stroke: #1E1E22; stroke-width: 0.02; }
    .grid-major { stroke: #33333A; stroke-width: 0.04; }
    .canvas { fill: none; stroke: #55555D; stroke-width: 0.04; }
    .live { fill: none; stroke: #4CC9F0; stroke-width: 0.05; }
    .inner { fill: none; stroke: #F072D6; stroke-width: 0.05; }
    .diag { fill: none; stroke: #E9B949; stroke-width: 0.04; }
    .dashed { stroke-dasharray: 0.3 0.2; }
    .dotted { stroke-dasharray: 0.08 0.16; opacity: 0.8; }
    .dim { fill: none; stroke: #ADADB4; stroke-width: 0.03; }
    text { fill: #ADADB4; font-family: "Geist Mono", ui-monospace, monospace; font-size: 0.5px; }
  </style>
  <rect id="background" x="-3" y="-3" width="30" height="31" fill="#0E0E10"/>

  <g id="grid">
    <line class="grid-major" x1="0" y1="0" x2="0" y2="24"/>
    <line class="grid-major" x1="0" y1="0" x2="24" y2="0"/>
    <line class="grid-minor" x1="1" y1="0" x2="1" y2="24"/>
    <line class="grid-minor" x1="0" y1="1" x2="24" y2="1"/>
    <line class="grid-minor" x1="2" y1="0" x2="2" y2="24"/>
    <line class="grid-minor" x1="0" y1="2" x2="24" y2="2"/>
    <line class="grid-minor" x1="3" y1="0" x2="3" y2="24"/>
    <line class="grid-minor" x1="0" y1="3" x2="24" y2="3"/>
    <line class="grid-minor" x1="4" y1="0" x2="4" y2="24"/>
    <line class="grid-minor" x1="0" y1="4" x2="24" y2="4"/>
    <line class="grid-minor" x1="5" y1="0" x2="5" y2="24"/>
    <line class="grid-minor" x1="0" y1="5" x2="24" y2="5"/>
    <line class="grid-minor" x1="6" y1="0" x2="6" y2="24"/>
    <line class="grid-minor" x1="0" y1="6" x2="24" y2="6"/>
    <line class="grid-minor" x1="7" y1="0" x2="7" y2="24"/>
    <line class="grid-minor" x1="0" y1="7" x2="24" y2="7"/>
    <line class="grid-minor" x1="8" y1="0" x2="8" y2="24"/>
    <line class="grid-minor" x1="0" y1="8" x2="24" y2="8"/>
    <line class="grid-minor" x1="9" y1="0" x2="9" y2="24"/>
    <line class="grid-minor" x1="0" y1="9" x2="24" y2="9"/>
    <line class="grid-minor" x1="10" y1="0" x2="10" y2="24"/>
    <line class="grid-minor" x1="0" y1="10" x2="24" y2="10"/>
    <line class="grid-minor" x1="11" y1="0" x2="11" y2="24"/>
    <line class="grid-minor" x1="0" y1="11" x2="24" y2="11"/>
    <line class="grid-major" x1="12" y1="0" x2="12" y2="24"/>
    <line class="grid-major" x1="0" y1="12" x2="24" y2="12"/>
    <line class="grid-minor" x1="13" y1="0" x2="13" y2="24"/>
    <line class="grid-minor" x1="0" y1="13" x2="24" y2="13"/>
    <line class="grid-minor" x1="14" y1="0" x2="14" y2="24"/>
    <line class="grid-minor" x1="0" y1="14" x2="24" y2="14"/>
    <line class="grid-minor" x1="15" y1="0" x2="15" y2="24"/>
    <line class="grid-minor" x1="0" y1="15" x2="24" y2="15"/>
    <line class="grid-minor" x1="16" y1="0" x2="16" y2="24"/>
    <line class="grid-minor" x1="0" y1="16" x2="24" y2="16"/>
    <line class="grid-minor" x1="17" y1="0" x2="17" y2="24"/>
    <line class="grid-minor" x1="0" y1="17" x2="24" y2="17"/>
    <line class="grid-minor" x1="18" y1="0" x2="18" y2="24"/>
    <line class="grid-minor" x1="0" y1="18" x2="24" y2="18"/>
    <line class="grid-minor" x1="19" y1="0" x2="19" y2="24"/>
    <line class="grid-minor" x1="0" y1="19" x2="24" y2="19"/>
    <line class="grid-minor" x1="20" y1="0" x2="20" y2="24"/>
    <line class="grid-minor" x1="0" y1="20" x2="24" y2="20"/>
    <line class="grid-minor" x1="21" y1="0" x2="21" y2="24"/>
    <line class="grid-minor" x1="0" y1="21" x2="24" y2="21"/>
    <line class="grid-minor" x1="22" y1="0" x2="22" y2="24"/>
    <line class="grid-minor" x1="0" y1="22" x2="24" y2="22"/>
    <line class="grid-minor" x1="23" y1="0" x2="23" y2="24"/>
    <line class="grid-minor" x1="0" y1="23" x2="24" y2="23"/>
    <line class="grid-major" x1="24" y1="0" x2="24" y2="24"/>
    <line class="grid-major" x1="0" y1="24" x2="24" y2="24"/>
    <rect class="canvas" x="0" y="0" width="24" height="24"/>
  </g>

  <g id="keylines">
    <!-- Live area: margin 2. -->
    <rect class="live dashed" x="2" y="2" width="20" height="20"/>
    <!-- Outer outline with the 18 % chamfer: c = 3.6. -->
    <polygon class="live" points="2,5.6 5.6,2 18.4,2 22,5.6 22,18.4 18.4,22 5.6,22 2,18.4"/>
    <!-- Inner keyline at t = 2.6; inner chamfer c′ = c − (2 − √2) t = 2.077, drawn as 2.08. -->
    <rect class="inner dashed" x="4.6" y="4.6" width="14.8" height="14.8"/>
    <polygon class="inner" points="4.6,6.677 6.677,4.6 17.323,4.6 19.4,6.677 19.4,17.323 17.323,19.4 6.677,19.4 4.6,17.323"/>
  </g>

  <g id="diagonals">
    <!-- 45° diagonals through the centre (12, 12). -->
    <line class="diag dashed" x1="0" y1="0" x2="24" y2="24"/>
    <line class="diag dashed" x1="24" y1="0" x2="0" y2="24"/>
    <!-- Cut bands: lines 1.8385 (t / √2) either side of each diagonal, so a 45° cut is t wide. -->
    <line class="diag dotted" x1="0" y1="22.1615" x2="22.1615" y2="0"/>
    <line class="diag dotted" x1="1.8385" y1="24" x2="24" y2="1.8385"/>
    <line class="diag dotted" x1="0" y1="1.8385" x2="22.1615" y2="24"/>
    <line class="diag dotted" x1="1.8385" y1="0" x2="24" y2="22.1615"/>
  </g>

  <g id="dimensions">
    <!-- Overall 24. -->
    <path class="dim" d="M0 -0.8H24M0 -1.05V-0.55M24 -1.05V-0.55"/>
    <text x="12" y="-1.1" text-anchor="middle">24</text>
    <!-- Margin 2, live area 20, margin 2. -->
    <path class="dim" d="M0 -2.1H24M0 -2.35V-1.85M2 -2.35V-1.85M22 -2.35V-1.85M24 -2.35V-1.85"/>
    <text x="1" y="-2.4" text-anchor="middle">2</text>
    <text x="12" y="-2.4" text-anchor="middle">20</text>
    <text x="23" y="-2.4" text-anchor="middle">2</text>
    <!-- Thickness t, from the live area to the inner keyline. -->
    <path class="dim" d="M-0.6 2V4.6M-0.85 2H-0.35M-0.85 4.6H-0.35"/>
    <text x="-1" y="3.47" text-anchor="end">t 2.6</text>
    <!-- Outer chamfer c, along the right edge. -->
    <path class="dim" d="M24.6 2V5.6M24.35 2H24.85M24.35 5.6H24.85"/>
    <text x="25" y="3.97">c 3.6</text>
    <!-- Inner chamfer c′, along the right edge. -->
    <path class="dim" d="M24.6 17.323V19.4M24.35 17.323H24.85M24.35 19.4H24.85"/>
    <text x="25" y="18.5315">c′ 2.08</text>
    <line class="live" x1="-2.4" y1="25.13" x2="-1.6" y2="25.13"/>
    <text x="-1.3" y="25.3">Live area 20 x 20, margin 2</text>
    <line class="live" x1="12.4" y1="25.13" x2="13.2" y2="25.13"/>
    <text x="13.5" y="25.3">Outer chamfer c = 3.6 (18 % of 20)</text>
    <line class="inner" x1="-2.4" y1="25.93" x2="-1.6" y2="25.93"/>
    <text x="-1.3" y="26.1">Thickness t = 2.6 (inner keyline)</text>
    <line class="inner" x1="12.4" y1="25.93" x2="13.2" y2="25.93"/>
    <text x="13.5" y="26.1">Inner chamfer c′ = c − 0.5858 t = 2.08</text>
    <line class="diag" x1="-2.4" y1="26.73" x2="-1.6" y2="26.73"/>
    <text x="-1.3" y="26.9">45° diagonals; cut band of width t</text>
    <line class="diag" x1="12.4" y1="26.73" x2="13.2" y2="26.73"/>
    <text x="13.5" y="26.9">Gap between inner elements t/2 = 1.3</text>
  </g>

  <g id="artwork">
    <!-- Draw here. -->
  </g>
</svg>
